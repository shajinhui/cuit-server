<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fbfcf9" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="成信友友" />
    <meta name="description" content="成信友友，面向成都信息工程大学学生的课表、成绩与校园生活助手。" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="成信友友" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      /*
       * 主题必须在首帧之前定下来，否则会先渲染浅色再翻成深色（闪白）。
       *
       * 这里只处理"用户显式选择"的情况：
       *   显式 light/dark → 写 data-theme，让 theme.css 的令牌块直接生效；
       *   未选择（跟随系统）→ 不写 data-theme，交给 CSS 的 prefers-color-scheme 分支，
       *                       这样系统切换时无需 JS 参与，也不会出现属性与系统不一致。
       * 规则必须与 src/shared/theme/colorScheme.ts 保持一致（storage key 与取值）。
       * 下面几组色值必须与 styles/theme.css 的 --app-canvas / --bg-page / --bg-page-schedule
       * 以及对应深色值对应，它们只用于首帧的启动屏，随后由 usePageTheme 接管。
       */
      (() => {
        const stored = (() => {
          try {
            return window.localStorage.getItem('color-scheme-preference')
          } catch {
            return null
          }
        })()
        const explicit = stored === 'dark' || stored === 'light' ? stored : null
        const dark =
          explicit === 'dark' ||
          (!explicit && window.matchMedia('(prefers-color-scheme: dark)').matches)
        const root = document.documentElement
        if (explicit) root.dataset.theme = explicit
        const schedule = location.pathname === '/' || location.pathname === '/schedule'
        if (schedule) root.dataset.initialPage = 'schedule'
        const canvas = dark ? '#000000' : '#fbfcf9'
        // 与 usePageTheme 的基调一致：课表首屏用课表底色，其余页面用分组底色。
        const page = dark ? (schedule ? '#0f141c' : '#1c1c1e') : schedule ? '#c9d5e7' : '#f2f2f7'
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', page)
        // 启动屏与首屏画布共用同一组变量，避免中间出现第三种颜色。
        root.style.setProperty('--launch-canvas', canvas)
        root.style.setProperty('--launch-page', page)
      })()
    </script>
    <script>
      (() => {
        const userAgent = navigator.userAgent
        const installed =
          navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches
        if (!installed || !/(?:iPhone|iPad|iPod)/i.test(userAgent)) return
        const versions = [
          /(?:iPhone|CPU) OS (\d+)[._]/i.exec(userAgent)?.[1],
          /(?:^|[\s(;])Version\/(\d+)(?:[._])/i.exec(userAgent)?.[1],
        ]
          .map((version) => Number(version))
          .filter((version) => Number.isInteger(version))
        if (versions.length > 0 && Math.max(...versions) >= 27) {
          document.documentElement.dataset.iosTopScrim = 'true'
        }
      })()
    </script>
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/app-icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/app-icon-192.png" />
    <title>成信友友</title>
    <style>
      /* 启动屏内联样式只允许使用这两组变量，主题切换逻辑见上方脚本。 */
      :root {
        --launch-canvas: #fbfcf9;
        --launch-page: #f2f2f7;
        --launch-text: #1c1c1e;
        --launch-muted: #8e8e93;
        --launch-mark-top: rgba(255, 255, 255, 0.96);
        --launch-mark-bottom: rgba(242, 242, 247, 0.72);
        --launch-mark-edge: rgba(255, 255, 255, 0.9);
        --launch-mark-shadow: rgba(28, 28, 30, 0.11);
        --launch-mark-inset: rgba(255, 255, 255, 0.95);
        --launch-sheen: rgba(255, 255, 255, 0.58);
      }

      /*
       * 深色启动屏。与 styles/theme.css 的暗色令牌同源：
       * 画布 #000、分组底 #1c1c1e、课表底 #0f141c，玻璃高光收敛到 12% 以内。
       * data-theme='dark' 与 prefers-color-scheme 都要覆盖，显式浅色主题优先。
       */
      @media (prefers-color-scheme: dark) {
        /* 跟随系统时 data-theme 不存在；显式浅色主题优先。 */
        :root:not([data-theme='light']) {
          --launch-canvas: #000000;
          --launch-page: #1c1c1e;
          --launch-text: #f2f2f7;
          --launch-muted: #98989d;
          --launch-mark-top: #2c2c2e;
          --launch-mark-bottom: #232325;
          --launch-mark-edge: rgba(255, 255, 255, 0.12);
          --launch-mark-shadow: rgba(0, 0, 0, 0.5);
          --launch-mark-inset: rgba(255, 255, 255, 0.12);
          --launch-sheen: rgba(255, 255, 255, 0.06);
        }

        :root:not([data-theme='light'])[data-initial-page='schedule'] {
          --launch-page: #0f141c;
        }
      }

      :root[data-theme='dark'] {
        --launch-canvas: #000000;
        --launch-page: #1c1c1e;
        --launch-text: #f2f2f7;
        --launch-muted: #98989d;
        --launch-mark-top: #2c2c2e;
        --launch-mark-bottom: #232325;
        --launch-mark-edge: rgba(255, 255, 255, 0.12);
        --launch-mark-shadow: rgba(0, 0, 0, 0.5);
        --launch-mark-inset: rgba(255, 255, 255, 0.12);
        --launch-sheen: rgba(255, 255, 255, 0.06);
      }

      :root[data-theme='dark'][data-initial-page='schedule'] {
        --launch-page: #0f141c;
      }

      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
        background: var(--launch-canvas);
      }

      .app-launch-screen {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        padding:
          max(24px, env(safe-area-inset-top, 0px))
          24px
          max(24px, env(safe-area-inset-bottom, 0px));
        place-items: center;
        color: var(--launch-text);
        background:
          linear-gradient(158deg, var(--launch-sheen), transparent 46%),
          var(--launch-page);
        box-sizing: border-box;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC",
          "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      html[data-initial-page='schedule'],
      html[data-initial-page='schedule'] body,
      html[data-initial-page='schedule'] #app,
      html[data-initial-page='schedule'] .app-launch-screen {
        background: var(--launch-page);
      }

      .app-launch-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: translateY(-3vh);
      }

      .app-launch-mark {
        display: grid;
        width: 72px;
        height: 72px;
        place-items: center;
        color: var(--launch-text);
        background: linear-gradient(145deg, var(--launch-mark-top), var(--launch-mark-bottom));
        border: 1px solid var(--launch-mark-edge);
        border-radius: 23px;
        box-shadow:
          0 18px 42px var(--launch-mark-shadow),
          inset 0 1px 0 var(--launch-mark-inset),
          inset 0 -1px 0 rgba(60, 60, 67, 0.07);
      }

      .app-launch-mark svg {
        width: 42px;
        height: 42px;
        overflow: visible;
      }

      .app-launch-mark-cap,
      .app-launch-mark-dot {
        fill: currentColor;
      }

      .app-launch-mark-base,
      .app-launch-mark-tassel {
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .app-launch-title {
        margin: 16px 0 0;
        font-size: 25px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.01em;
      }

      .app-launch-status {
        margin: 9px 0 0;
        color: var(--launch-muted);
        font-size: 13px;
        line-height: 1.4;
      }

      .app-launch-status::after {
        display: inline-block;
        width: 1.25em;
        overflow: hidden;
        vertical-align: bottom;
        content: "…";
        animation: app-launch-dots 1.2s steps(4, end) infinite;
      }

      @keyframes app-launch-dots {
        0% {
          width: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-launch-status::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="ios-pwa-status-strip" class="ios-pwa-status-strip" aria-hidden="true"></div>
    <div id="app">
      <div class="app-launch-screen" role="status" aria-label="成信友友正在启动">
        <div class="app-launch-content">
          <div class="app-launch-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path class="app-launch-mark-cap" d="m3.5 12.1 12.5-6 12.5 6L16 18.2 3.5 12.1Z" />
              <path class="app-launch-mark-base" d="M8.1 15.1v5.2c2 2.2 4.7 3.3 7.9 3.3s5.9-1.1 7.9-3.3v-5.2" />
              <path class="app-launch-mark-tassel" d="M28.5 12.2v7.1" />
              <circle class="app-launch-mark-dot" cx="28.5" cy="21.5" r="1.6" />
            </svg>
          </div>
          <p class="app-launch-title">成信友友</p>
          <p class="app-launch-status">正在启动</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
