<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#fbfcf9" />
    <meta name="application-name" content="成信友友" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="成信友友" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/app-icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/app-icon-192.png" />
    <title>成信友友</title>
    <style>
      html,
      body,
      #app {
        min-height: 100%;
        margin: 0;
        background: #f2f2f7;
      }

      .app-launch-screen {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        padding:
          max(24px, env(safe-area-inset-top, 0px))
          24px
          max(24px, env(safe-area-inset-bottom, 0px));
        place-items: center;
        color: #1c1c1e;
        background:
          linear-gradient(158deg, rgba(255, 255, 255, 0.58), transparent 46%),
          #f2f2f7;
        box-sizing: border-box;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC",
          "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .app-launch-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: translateY(-3vh);
      }

      .app-launch-mark {
        display: grid;
        width: 72px;
        height: 72px;
        place-items: center;
        color: #1c1c1e;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.96), rgba(242, 242, 247, 0.72));
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 23px;
        box-shadow:
          0 18px 42px rgba(28, 28, 30, 0.11),
          inset 0 1px 0 rgba(255, 255, 255, 0.95),
          inset 0 -1px 0 rgba(60, 60, 67, 0.07);
      }

      .app-launch-mark svg {
        width: 42px;
        height: 42px;
        overflow: visible;
      }

      .app-launch-mark-cap,
      .app-launch-mark-dot {
        fill: currentColor;
      }

      .app-launch-mark-base,
      .app-launch-mark-tassel {
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .app-launch-title {
        margin: 16px 0 0;
        font-size: 25px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -0.01em;
      }

      .app-launch-status {
        margin: 9px 0 0;
        color: #8e8e93;
        font-size: 13px;
        line-height: 1.4;
      }

      .app-launch-status::after {
        display: inline-block;
        width: 1.25em;
        overflow: hidden;
        vertical-align: bottom;
        content: "…";
        animation: app-launch-dots 1.2s steps(4, end) infinite;
      }

      @keyframes app-launch-dots {
        0% {
          width: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-launch-status::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-launch-screen" role="status" aria-label="成信友友正在启动">
        <div class="app-launch-content">
          <div class="app-launch-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path class="app-launch-mark-cap" d="m3.5 12.1 12.5-6 12.5 6L16 18.2 3.5 12.1Z" />
              <path class="app-launch-mark-base" d="M8.1 15.1v5.2c2 2.2 4.7 3.3 7.9 3.3s5.9-1.1 7.9-3.3v-5.2" />
              <path class="app-launch-mark-tassel" d="M28.5 12.2v7.1" />
              <circle class="app-launch-mark-dot" cx="28.5" cy="21.5" r="1.6" />
            </svg>
          </div>
          <p class="app-launch-title">成信友友</p>
          <p class="app-launch-status">正在启动</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
