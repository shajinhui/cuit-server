<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">成信友友当前项目架构</title>
  <desc id="desc">展示 Vue PWA 与 Capacitor Android 客户端、Cloudflare Pages 和 Tunnel、Hertz 模块化单体、MySQL、Redis、独立 JWXT SDK、学校认证与教务系统，以及交付链路。</desc>

  <defs>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#253142" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2d3138"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#377fba"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif; }
      .title { font-size: 44px; font-weight: 700; fill: #20242b; }
      .subtitle { font-size: 18px; font-weight: 400; fill: #6f7680; letter-spacing: .5px; }
      .section { font-size: 24px; font-weight: 600; fill: #20242b; }
      .node-title { font-size: 21px; font-weight: 600; fill: #20242b; }
      .node-text { font-size: 16px; font-weight: 400; fill: #555d68; }
      .small { font-size: 14px; font-weight: 500; fill: #6c737e; }
      .arrow-label { font-size: 14px; font-weight: 500; fill: #424850; }
      .arrow { fill: none; stroke: #2d3138; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #377fba; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .arrow-dashed { fill: none; stroke: #59616b; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .node { stroke: #444a52; stroke-width: 1.8; filter: url(#softShadow); }
      .external { stroke: #444a52; stroke-width: 1.8; stroke-dasharray: 9 7; filter: url(#softShadow); }
    </style>
  </defs>

  <rect width="1600" height="1050" fill="#fbfcfd"/>
  <text x="36" y="58" class="title">成信友友 · Architecture</text>
  <text x="36" y="91" class="subtitle">模块化 Go 单体 + 独立 JWXT SDK + 多端客户端</text>
