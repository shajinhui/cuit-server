name: iOS IPA

on:
  workflow_dispatch:
    inputs:
      web_mode:
        description: Web assets bundled in the IPA
        required: true
        default: apk
        type: choice
        options:
          - apk
          - source
      export_method:
        description: IPA export method
        required: true
        default: release-testing
        type: choice
        options:
          - release-testing
          - debugging
          - app-store-connect

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_EXPORT_METHOD: ${{ inputs.export_method }}
      IOS_WEB_MODE: ${{ inputs.web_mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Validate signing secrets
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          for name in IOS_TEAM_ID IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Secret: $name"
              exit 1
            fi
          done

      - name: Install dependencies and sync iOS
        run: |
          pnpm config set registry https://registry.npmjs.org
          pnpm install --frozen-lockfile
          pnpm run "ios:sync:$IOS_WEB_MODE"

      - name: Install signing certificate and profile
        id: signing
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          certificate_path="$RUNNER_TEMP/signing.p12"
          profile_path="$RUNNER_TEMP/profile.mobileprovision"
          profile_plist="$RUNNER_TEMP/profile.plist"
          keychain_path="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"

          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "profile_name=$profile_name" >> "$GITHUB_OUTPUT"

      - name: Archive and export IPA
        env:
          IOS_PROVISIONING_PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          IOS_SKIP_SYNC: '1'
        run: bash scripts/build-ios-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: chengxin-youyou-ipa
          path: apps/web/ios/output/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14
