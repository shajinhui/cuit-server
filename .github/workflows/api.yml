name: API CI/CD

on:
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - migrations/**
      - deploy/scripts/deploy-api.sh
      - .github/workflows/api.yml
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - migrations/**
      - deploy/scripts/deploy-api.sh
      - .github/workflows/api.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./... -count=1

      - name: Vet
        run: go vet ./...

      - name: Build Debian amd64 binary
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" \
            -o dist/cuit-server-api ./apps/api

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: cuit-server-api-linux-amd64
          path: dist/cuit-server-api
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on:
      - self-hosted
      - Linux
      - X64
      - cuit-production
    environment:
      name: production
      url: https://api.fanxiaogao05.dpdns.org

    steps:
      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: cuit-server-api-linux-amd64
          path: artifact

      - name: Deploy API
        run: |
          chmod 0755 artifact/cuit-server-api
          sudo /usr/local/sbin/deploy-cuit-server-api \
            "$GITHUB_WORKSPACE/artifact/cuit-server-api"
